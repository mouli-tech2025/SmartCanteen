<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="burgerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="swDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C2410C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Decorative circles -->
  <circle cx="160" cy="110" r="85" fill="url(#swGrad)" opacity="0.6"/>
  <circle cx="250" cy="50" r="14" fill="#F97316" opacity="0.2"/>
  <circle cx="65" cy="160" r="18" fill="#FFFFFF" opacity="0.5"/>

  <!-- Main Food Group -->
  <g filter="url(#swDrop)" transform="translate(10, 0)">
    <!-- Plate / Serving Board -->
    <rect x="70" y="150" width="160" height="14" rx="7" fill="#78350F" opacity="0.8"/>
    <rect x="75" y="148" width="150" height="10" rx="5" fill="#B45309"/>

    <!-- Burger -->
    <g transform="translate(85, 60)">
      <!-- Top Bun -->
      <path d="M 10 40 C 10 15, 65 15, 65 40 Z" fill="#F59E0B"/>
      <!-- Sesame seeds -->
      <circle cx="28" cy="27" r="1.5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="42" cy="24" r="1.5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="50" cy="31" r="1.5" fill="#FFFFFF" opacity="0.8"/>
      <!-- Lettuce -->
      <path d="M 7 42 Q 18 48, 25 42 T 45 42 T 68 42" fill="none" stroke="#16A36A" stroke-width="5" stroke-linecap="round"/>
      <!-- Cheese -->
      <polygon points="12,47 63,47 52,56 40,49 20,53" fill="#FCD34D"/>
      <!-- Patty -->
      <rect x="10" y="52" width="55" height="12" rx="4" fill="#78350F"/>
      <!-- Bottom Bun -->
      <rect x="12" y="66" width="51" height="12" rx="5" fill="#F59E0B"/>
    </g>

    <!-- Cold Beverage Cup -->
    <g transform="translate(165, 55)">
      <!-- Cup Body -->
      <path d="M 10 25 L 18 85 L 42 85 L 50 25 Z" fill="#FFFFFF" opacity="0.9"/>
      <!-- Drink liquid inside -->
      <path d="M 12 38 L 19 82 L 41 82 L 48 38 Z" fill="#F97316"/>
      <!-- Ice cubes -->
      <rect x="20" y="44" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.6"/>
      <rect x="28" y="58" width="9" height="9" rx="2" fill="#FFFFFF" opacity="0.6"/>
      <!-- Lid -->
      <ellipse cx="30" cy="25" rx="22" ry="5" fill="#252525"/>
      <!-- Straw -->
      <path d="M 33 22 L 42 0" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
      <!-- Brand icon on cup -->
      <circle cx="30" cy="60" r="7" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="30" cy="60" r="4" fill="#F97316"/>
    </g>
  </g>

  <!-- Floating snack elements: French fry / stars -->
  <g transform="translate(45, 70) rotate(-20)">
    <rect x="0" y="0" width="6" height="24" rx="3" fill="#FBBF24"/>
  </g>
  <g transform="translate(235, 120) rotate(15)">
    <circle cx="0" cy="0" r="7" fill="#16A36A" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#16A36A"/>
  </g>
</svg>

