<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Smart Canteen</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="../assets/images/favicon.png">
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <link rel="shortcut icon" href="../assets/images/favicon.ico">

    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background: #FFF9F1;
            min-height: 100vh;
            color: #252525;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        .auth-wrapper {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: #FFFFFF;
            padding: 36px 32px;
            border-radius: 20px;
            border: 1px solid #FED7AA;
            box-shadow: 0 16px 40px -10px rgba(37, 37, 37, 0.07);
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-illustration-wrap {
            width: 110px;
            height: 85px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-illustration-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .auth-heading h1 {
            font-size: 26px;
            font-weight: 800;
            color: #252525;
            margin-bottom: 6px;
        }

        .auth-heading p {
            color: #777777;
            font-size: 14px;
            margin: 0;
        }

        .role-label,
        .form-group label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #252525;
        }

        .role-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-option {
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 12px 6px;
            background: #FFF9F1;
            cursor: pointer;
            color: #777777;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .role-option svg,
        .role-option i {
            stroke: currentColor;
        }

        .role-option:hover {
            border-color: #FDBA74;
            color: #F97316;
            background: #FFF2E2;
        }

        .role-option.active {
            border: 2px solid #F97316;
            background: #FFF0DF;
            color: #F97316;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.12);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #FFFFFF;
            color: #252525;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #F97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        }

        .auth-submit {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #F97316;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-submit:hover {
            background: #EA580C;
            transform: translateY(-1px);
        }

        .auth-switch {
            margin-top: 20px;
            font-size: 13.5px;
            color: #777777;
            text-align: center;
        }

        .auth-switch button {
            background: none;
            border: none;
            color: #F97316;
            font-weight: 700;
            cursor: pointer;
            font-size: 13.5px;
            text-decoration: underline;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
            font-weight: 600;
        }

        .auth-message.error {
            display: block;
            background: #FEE2E2;
            color: #DC2626;
            border: 1px solid #FECACA;
        }

        .auth-message.success {
            display: block;
            background: #DCFCE7;
            color: #16A36A;
            border: 1px solid #BBF7D0;
        }

        .auth-note {
            margin-top: 20px;
            padding: 14px;
            background: #FFF9F1;
            border: 1px solid #FED7AA;
            border-radius: 10px;
            color: #9A3412;
            font-size: 12px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar" style="background:#FFFFFF; border-bottom:1px solid #FED7AA;">
        <div class="container nav-container">
            <a href="../index.html" class="brand-logo">
                <div class="brand-icon" style="background:#F97316; color:#FFFFFF; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/><path d="M15 11v11"/><path d="M5 2v4a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V2"/><path d="M8 9v13"/>
                    </svg>
                </div>
                <span>Smart<span class="accent">Canteen</span></span>
            </a>

            <a href="../index.html" class="btn btn-secondary btn-sm" style="display:inline-flex; align-items:center; gap:6px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Back to Home
            </a>
        </div>
    </header>

    <!-- Authentication Section -->
    <main class="auth-wrapper">

        <section class="auth-card">

            <div class="auth-heading">
                <div class="auth-illustration-wrap">
                    <img src="../assets/images/illustrations/login.svg" alt="Smart Canteen Authentication">
                </div>
                <h1 id="authTitle">Welcome Back!</h1>
                <p id="authSubtitle">
                    Sign in to access your canteen portal.
                </p>
            </div>

            <!-- Role Selection -->
            <label class="role-label">Select Your Portal</label>

            <div class="role-options">

                <button type="button"
                        class="role-option active"
                        data-role="student">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    Student
                </button>

                <button type="button"
                        class="role-option"
                        data-role="staff">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/>
                    </svg>
                    Staff
                </button>

                <button type="button"
                        class="role-option"
                        data-role="admin">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
                    </svg>
                    Admin
                </button>

            </div>

            <!-- Message -->
            <div id="authMessage" class="auth-message"></div>

            <!-- Authentication Form -->
            <form id="authForm">

                <!-- Name: Only for Student Registration -->
                <div class="form-group hidden" id="nameGroup">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="e.g. Rahul Sharma"
                        autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="e.g. student@smartcanteen.com"
                        required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="auth-submit" id="submitButton">
                    Sign In
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>

            </form>

            <!-- Registration Toggle -->
            <div class="auth-switch" id="registerSection">
                Don't have a student account?
                <button type="button" id="registerToggle">
                    Create Account
                </button>
            </div>

            <!-- Demo Information -->
            <div class="auth-note" id="demoInfo">
                <strong>Demo Credentials</strong><br>
                Email: student@smartcanteen.com &bull; Password: Student@123
            </div>

        </section>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
