<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F1"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="receiptShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#252525" flood-opacity="0.08"/>
    </filter>
  </defs>

  <circle cx="100" cy="90" r="65" fill="url(#orderGrad)"/>
  
  <g transform="translate(62, 35)" filter="url(#receiptShadow)">
    <!-- Clipboard Backing -->
    <rect x="0" y="8" width="76" height="102" rx="8" fill="#E5E7EB"/>
    <!-- Clip -->
    <rect x="22" y="0" width="32" height="14" rx="4" fill="#252525"/>
    <rect x="28" y="4" width="20" height="4" rx="2" fill="#F97316"/>
    
    <!-- Paper Sheet -->
    <rect x="6" y="16" width="64" height="88" rx="4" fill="#FFFFFF"/>
    
    <!-- Paper text lines -->
    <rect x="14" y="28" width="30" height="4" rx="2" fill="#F97316"/>
    <circle cx="56" cy="30" r="3" fill="#16A36A"/>
    
    <rect x="14" y="40" width="48" height="2.5" rx="1.2" fill="#E5E7EB"/>
    <rect x="14" y="48" width="38" height="2.5" rx="1.2" fill="#E5E7EB"/>
    <rect x="14" y="56" width="44" height="2.5" rx="1.2" fill="#E5E7EB"/>
    
    <path d="M 14 68 L 62 68" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <rect x="14" y="76" width="20" height="3" rx="1.5" fill="#777777"/>
    <rect x="42" y="76" width="20" height="3" rx="1.5" fill="#F97316"/>
  </g>
</svg>

