<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F1"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="100" cy="90" r="65" fill="url(#cartBg)"/>
  <circle cx="145" cy="45" r="8" fill="#FDBA74" opacity="0.4"/>
  <circle cx="50" cy="120" r="5" fill="#F97316" opacity="0.2"/>

  <!-- Shopping Cart Icon/Illustration -->
  <g transform="translate(42, 40)">
    <!-- Cart wheels -->
    <circle cx="38" cy="85" r="8" fill="#252525"/>
    <circle cx="38" cy="85" r="3" fill="#FFFFFF"/>
    <circle cx="82" cy="85" r="8" fill="#252525"/>
    <circle cx="82" cy="85" r="3" fill="#FFFFFF"/>

    <!-- Basket base frame -->
    <path d="M 5 15 L 22 15 L 36 68 L 88 68 L 98 28 L 30 28" 
          fill="none" stroke="#252525" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Basket grid lines -->
    <path d="M 34 42 L 94 42" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 35 55 L 90 55" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 52 28 L 50 68" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 72 28 L 70 68" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Floating Empty dotted indicator -->
    <circle cx="62" cy="48" r="16" fill="#FFFFFF" stroke="#F97316" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="62" y="53" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F97316" text-anchor="middle">?</text>
  </g>
</svg>

