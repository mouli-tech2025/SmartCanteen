<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F1"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#252525" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Backdrop circle -->
  <circle cx="200" cy="150" r="110" fill="url(#bgGrad)"/>
  <circle cx="290" cy="70" r="16" fill="#FDBA74" opacity="0.4"/>
  <circle cx="90" cy="210" r="10" fill="#F97316" opacity="0.2"/>
  
  <!-- Counter/Table base -->
  <rect x="70" y="220" width="260" height="12" rx="6" fill="#E5E7EB"/>
  <rect x="90" y="232" width="220" height="6" rx="3" fill="#D1D5DB" opacity="0.5"/>
  
  <!-- Cloche / Food Plate -->
  <g filter="url(#shadow)">
    <!-- Plate -->
    <ellipse cx="200" cy="210" rx="75" ry="14" fill="#FFFFFF"/>
    <ellipse cx="200" cy="208" rx="68" ry="10" fill="#F3F4F6"/>
    
    <!-- Cloche Dome -->
    <path d="M 140 205 C 140 145, 260 145, 260 205 Z" fill="url(#orangeGrad)"/>
    
    <!-- Cloche Handle -->
    <circle cx="200" cy="140" r="10" fill="#EA580C"/>
    <rect x="196" y="146" width="8" height="6" fill="#C2410C"/>
    
    <!-- Cloche Highlights -->
    <path d="M 160 195 C 160 160, 200 152, 215 152" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Steam floating upward -->
  <path d="M 180 120 Q 175 105, 185 95 T 180 75" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 200 125 Q 195 105, 205 90 T 200 65" fill="none" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 220 120 Q 225 105, 215 95 T 220 75" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Small food tech badge: smartphone order screen -->
  <g transform="translate(85, 110) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="48" height="80" rx="8" fill="#252525"/>
    <rect x="4" y="6" width="40" height="68" rx="5" fill="#FFFFFF"/>
    <!-- Screen content -->
    <rect x="8" y="12" width="22" height="4" rx="2" fill="#F97316"/>
    <circle cx="34" cy="14" r="3" fill="#16A36A"/>
    <rect x="8" y="22" width="32" height="20" rx="4" fill="#FFEDD5"/>
    <rect x="8" y="47" width="20" height="3" rx="1.5" fill="#777777"/>
    <rect x="8" y="53" width="14" height="3" rx="1.5" fill="#F97316"/>
    <rect x="8" y="61" width="32" height="7" rx="3.5" fill="#F97316"/>
  </g>

  <!-- Sparkles -->
  <path d="M 285 110 L 290 120 L 300 125 L 290 130 L 285 140 L 280 130 L 270 125 L 280 120 Z" fill="#F97316" opacity="0.75" transform="scale(0.7) translate(130, 20)"/>
</svg>

