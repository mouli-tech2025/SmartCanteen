<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F1"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#252525" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="400" cy="270" r="170" fill="none" stroke="#FDBA74" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="400" cy="270" r="130" fill="#FFFFFF" filter="url(#softShadow)"/>
  
  <!-- Cloche / Plate art -->
  <g transform="translate(400, 270)">
    <!-- Base Plate -->
    <ellipse cx="0" cy="50" rx="90" ry="16" fill="#FED7AA"/>
    <ellipse cx="0" cy="46" rx="80" ry="12" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    
    <!-- Dome Cover -->
    <path d="M -60 40 C -60 -15, 60 -15, 60 40 Z" fill="#F97316" opacity="0.95"/>
    <circle cx="0" cy="-22" r="8" fill="#EA580C"/>
    
    <!-- Steam Lines -->
    <path d="M -20 -38 C -24 -48, -16 -54, -20 -64" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M 0 -42 C -4 -52, 4 -58, 0 -68" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 20 -38 C 16 -48, 24 -54, 20 -64" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  </g>
  
  <!-- Label -->
  <text x="400" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#252525" text-anchor="middle" letter-spacing="-0.02em">
    Smart Canteen Fresh Meal
  </text>
  <text x="400" y="470" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#777777" text-anchor="middle">
    Prepared fresh daily for campus dining
  </text>
</svg>

